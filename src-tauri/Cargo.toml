[package]
name = "domain-manager"
version = "0.1.0"
description = "Local website and domain collection manager"
authors = ["DOMAIN."]
edition = "2021"

[lib]
name = "domain_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
